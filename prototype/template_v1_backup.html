<title>임장월드 프로토 신당·왕십리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-viewport canvas world; HUD top bar; bottom sheet(모바일) / right drawer(데스크톱); modals for flow */
:root{
  --bg:#eef3ea; --fg:#1d2a26; --muted:#5f6f69; --line:#cfd9d2; --surface:#ffffff; --surface2:#f4f7f2;
  --accent:#1f8a4c; --accent-ink:#ffffff; --signal:#e2a71b; --danger:#c8463b;
  --A:#1f8a4c; --B:#2d7bd1; --C:#b2731a; --X:#8a8a8a;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#131a17; --fg:#e8eee9; --muted:#9fb0a8; --line:#2d3a35; --surface:#1b2420; --surface2:#222c27; --accent:#5fd08a; --accent-ink:#0f1a14; --signal:#f0c050; --danger:#ef7b70; --A:#5fd08a; --B:#7db7f2; --C:#e1b16a; --X:#9a9a9a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#131a17; --fg:#e8eee9; --muted:#9fb0a8; --line:#2d3a35; --surface:#1b2420; --surface2:#222c27; --accent:#5fd08a; --accent-ink:#0f1a14; --signal:#f0c050; --danger:#ef7b70; --A:#5fd08a; --B:#7db7f2; --C:#e1b16a; --X:#9a9a9a; color-scheme:dark }
*{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;touch-action:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
button{font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--display);font-weight:400}
#modes{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
#modes button{border:0;background:transparent;min-height:32px;padding:4px 9px;border-radius:999px;font-size:13px}
#modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#hud{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);display:flex;gap:8px;align-items:flex-end;justify-content:flex-start;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#stats{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:150px;max-width:62vw;font-size:12.5px}
#stats b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
#stats .row{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}
#actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:899px){ body.drawer-open #hud{display:none} }
#minimap{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 56px);width:150px;height:88px;border:1px solid var(--line);border-radius:8px;background:var(--surface);z-index:4;touch-action:none}
#adslot{position:fixed;left:0;right:0;bottom:0;height:calc(50px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface2);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--muted);z-index:5}
#adslot .lab{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 100px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
#drawer{position:fixed;z-index:6;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#drawer header{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#drawer header .tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
#drawer header .tabs button{min-height:30px;padding:3px 9px;font-size:12.5px;border-radius:999px}
#drawer .body{overflow:auto;padding:10px 12px;min-width:0;-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  #drawer{right:10px;top:calc(env(safe-area-inset-top,0px) + 156px);bottom:calc(60px + env(safe-area-inset-bottom,0px));width:360px;border-radius:14px}
  #drawer.hidden{display:none}
}
@media (max-width:899px){
  #drawer{left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));max-height:52vh;border-radius:16px 16px 0 0}
  #drawer.hidden{display:none}
  #minimap{width:110px;height:64px}
  #stats{max-width:58vw}
  #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
.badge{display:inline-block;font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:4px;line-height:16px;vertical-align:middle}
.g-A,.g-A-est{color:var(--A)} .g-B{color:var(--B)} .g-C{color:var(--C)} .g-X,.g-unknown,.g-X→확인{color:var(--X)} .g-F,.g-concept{color:#8b5cf6}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--surface2)}
.card h4{margin:0 0 4px;font-size:13.5px}
.card p{margin:3px 0;font-size:12.5px}
.card .src{color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:3px 8px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.check li .box{width:18px;height:18px;border:2px solid var(--line);border-radius:5px;flex:none;margin-top:2px}
.check li.done .box{background:var(--accent);border-color:var(--accent)}
.check li.done{color:var(--muted);text-decoration:line-through}
.poi-list button{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 10px;min-height:36px}
#modal{position:fixed;inset:0;background:rgba(10,20,16,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.hidden{display:none}
#modal .box{background:var(--surface);color:var(--fg);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px 18px 16px;border:1px solid var(--line)}
#modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
#modal h3{font-size:15px;margin:14px 0 6px}
#modal p{margin:6px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opts button{min-height:64px;text-align:left;padding:10px 12px;line-height:1.35}
.opts button small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.opts button[aria-pressed="true"] small{color:inherit;opacity:.85}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.cmp th{color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
textarea.note{width:100%;min-height:200px;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.muted{color:var(--muted)} .small{font-size:12px}
.lines span{display:inline-block;color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;margin-right:3px;line-height:16px}
.interstitial{position:fixed;inset:0;background:#111;color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.interstitial.hidden{display:none}
.ridehint{font-size:12px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>

<canvas id="world" aria-label="신당·왕십리 임장 월드"></canvas>
<canvas id="minimap" aria-label="미니맵"></canvas>

<div id="top">
  <span class="chip" id="chipComplex"><b>단지</b> —</span>
  <div id="modes" role="group" aria-label="이동 수단">
    <button data-mode="walk" aria-pressed="true">🚶 도보</button>
    <button data-mode="stroller" aria-pressed="false">🍼 유모차</button>
    <button data-mode="bike" aria-pressed="false">🚲 자전거</button>
    <button data-mode="car" aria-pressed="false">🚗 차</button>
  </div>
  <span class="chip" id="chipClock">🕗 <b>아침 08시</b></span>
  <button class="small" id="btnNight" aria-pressed="false">🌙 밤</button>
  <button class="small" id="btnDrawer">📋 서랍</button>
</div>

<div id="hud">
  <div id="stats">
    <div><b id="stMin">0</b> 분 <span class="muted small" id="stMode">도보 · 실제 환산</span></div>
    <div class="row"><span id="stDist">0 m</span><span id="stUp">↑0 m</span><span id="stCross">횡단 0</span><span id="stStairs">계단 0</span></div>
    <div class="row small" id="stHint">목적지를 탭하거나 서랍에서 고르세요</div>
  </div>
  <div id="actions">
    <button class="small" id="btnSkip" hidden>⏩ 건너뛰기</button>
    <button class="small" id="btnDest">📍 목적지</button>
    <button class="small" id="btnNote">📝 노트</button>
    <button class="small" id="btnCenter">🎯 내 위치</button>
  </div>
</div>

<div id="drawer" class="hidden">
  <header>
    <div class="tabs">
      <button data-tab="info" aria-pressed="true">단지</button>
      <button data-tab="check" aria-pressed="false">체크리스트</button>
      <button data-tab="cards" aria-pressed="false">이슈 카드</button>
      <button data-tab="dest" aria-pressed="false">목적지</button>
      <button data-tab="cmp" aria-pressed="false">비교</button>
    </div>
    <button class="small" id="btnDrawerClose" aria-label="서랍 닫기">✕</button>
  </header>
  <div class="body" id="drawerBody"></div>
</div>

<div id="adslot"><span class="lab">광고</span><span>DOM 배너 슬롯(모의) · 캔버스 밖 · 정보는 광고 뒤에 잠기지 않음</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="interstitial" class="interstitial hidden"><div><span class="badge" style="color:#fff">광고</span> 셀 이동 전면 광고(모의)</div><div id="interCount">3</div><button id="interSkip" class="small">건너뛰기</button></div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script id="cell" type="application/json">/*__DATA__*/</script>
<script>
window.__errs = []; window.addEventListener('error', e => window.__errs.push((e.message||'err') + ' @' + e.lineno + ':' + e.colno)); window.addEventListener('unhandledrejection', e => window.__errs.push('rej ' + (e.reason && e.reason.message || e.reason)));
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('cell').textContent);
const W = DATA.meta.W, H = DATA.meta.H, TILE_M = DATA.meta.tile_m;
const E = DATA.elev, K = DATA.kind, R = DATA.rcls, LN = DATA.lanes, CR = DATA.cross, ST = DATA.steps;
const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const TW = 32, TH = 16, ZS = 1.15, LH = 2.3;      // 타일 px, 고도 px/m, 층당 px
const KIND = {GROUND:0, ROAD:1, FOOT:2, STEPS:3, BLD:4, PARK:5, SCHOOL:6, CONST:7};
const SPEED = {walk:4.0, stroller:3.2, bike:12, car:22}; // km/h (모델 가정)
const MODE_KO = {walk:'도보', stroller:'유모차', bike:'자전거', car:'차'};
const LINE_COLOR = {'1':'#0052A4','2':'#00A84D','3':'#EF7C1C','4':'#00A5DE','5':'#996CAC','6':'#CD7C2F','경의중앙':'#77C4A3','수인분당':'#F5A200'};
const CONCEPTS = {
  solo:   {name:'1인 임장',  mode:'walk',     w:{traffic:35, school:0,  conv:20, env:25, park:5,  safe:15}},
  couple: {name:'커플 임장', mode:'walk',     w:{traffic:30, school:10, conv:25, env:20, park:10, safe:5}},
  family: {name:'가족 임장', mode:'stroller', w:{traffic:20, school:30, conv:15, env:20, park:10, safe:5}},
};
const CHECKLISTS = {
  solo:[{id:'gate',l:'역 출구에서 단지 정문까지 걸어가기',c:{arrive:'gate'}},{id:'conv',l:'가장 가까운 편의점·마트 가보기',c:{poi:['conv','mart']}},{id:'night',l:'밤 모드로 단지 앞 길 보기(연출, 가로등 데이터 없음)',c:{night:true}},{id:'commute',l:'출근 레그 돌려보기',c:{commute:true}},{id:'interior',l:'단지 내부(주차장·커뮤니티) 열어보기',c:{interior:true}}],
  couple:[{id:'gate',l:'역 출구에서 단지 정문까지 걸어가기',c:{arrive:'gate'}},{id:'park',l:'공원·놀이터 가보기',c:{poi:['park','play']}},{id:'car',l:'차 모드로 정문(주차장) 진입',c:{arrive:'gate',mode:'car'}},{id:'commute',l:'두 직장 출근 레그 비교',c:{commute2:true}},{id:'interior',l:'단지 내부 열어보기',c:{interior:true}}],
  family:[{id:'gateS',l:'유모차로 역 출구→정문 가보기(계단 우회)',c:{arrive:'gate',mode:'stroller'}},{id:'elem',l:'유모차로 초등학교 정문까지(횡단 횟수 세기)',c:{poi:['elem'],mode:'stroller'}},{id:'play',l:'놀이터·공원 가보기',c:{poi:['play','park']}},{id:'med',l:'소아과·약국 가보기',c:{poi:['med']}},{id:'mart',l:'마트 가보기',c:{poi:['mart']}},{id:'car',l:'차 모드로 지하주차장 진입',c:{arrive:'gate',mode:'car'}}],
};
// 지하철 역 그래프(손입력, 역 순서 기준 추정: 역간 2분 + 환승 5분)
const LINES = {
  '2':['시청','을지로입구','을지로3가','을지로4가','동대문역사문화공원','신당','상왕십리','왕십리','한양대','뚝섬','성수','건대입구','구의','강변','잠실나루','잠실','잠실새내','종합운동장','삼성','선릉','역삼','강남','교대','서초','방배','사당','낙성대','서울대입구','봉천','신림','신대방','구로디지털단지','대림','신도림','문래','영등포구청','당산','합정','홍대입구','신촌','이대','아현','충정로','시청'],
  '5':['마곡','발산','우장산','화곡','까치산','신정','목동','오목교','양평','영등포구청','영등포시장','신길','여의도','여의나루','마포','공덕','애오개','충정로','서대문','광화문','종로3가','을지로4가','동대문역사문화공원','청구','신금호','행당','왕십리','마장','답십리','장한평','군자'],
  '6':['디지털미디어시티','월드컵경기장','마포구청','망원','합정','상수','광흥창','대흥','공덕','효창공원앞','삼각지','녹사평','이태원','한강진','버티고개','약수','청구','신당','동묘앞','창신','보문','안암','고려대','월곡','상월곡','돌곶이','석계','태릉입구','화랑대','봉화산','신내'],
};
const HUBS = ['강남','삼성','시청','광화문','여의도','성수','구로디지털단지','디지털미디어시티','마곡','홍대입구','잠실','왕십리'];

// ---------- 상태 ----------
const S = {concept:null, mode:'walk', complex:null, px:0, py:0, night:false, clock:'am', zoom:1, camX:0, camY:0, follow:true,
  traveling:null, visited:new Set(), cardsSeen:new Set(), done:new Set(), events:[], lastInterstitial:0, commuteDone:0, interior:false, metrics:{}, routeLog:[]};
try { const sv = JSON.parse(localStorage.getItem('imjang-proto-v1') || 'null'); if (sv && sv.done) { S.done = new Set(sv.done); S.cardsSeen = new Set(sv.cardsSeen||[]); S.routeLog = sv.routeLog||[]; } } catch(e){}
const save = () => { try { localStorage.setItem('imjang-proto-v1', JSON.stringify({done:[...S.done], cardsSeen:[...S.cardsSeen], routeLog:S.routeLog.slice(-30)})); } catch(e){} };

// ---------- 투영 ----------
const zAt = (x, y) => inb(x, y) ? E[idx(x, y)] : 20;
function proj(x, y, z) { return [ (x - y) * TW / 2, (x + y) * TH / 2 - z * ZS ]; }
const maxE = Math.max(...E);
const WX0 = -(H) * TW / 2 - 40, WX1 = W * TW / 2 + 40, WY0 = -maxE * ZS - 140, WY1 = (W + H) * TH / 2 + 40;

// ---------- 색 ----------
const C = {
  ground:['#dfe6d0','#d6dfc6'], park:['#bfe0b4','#b2d7a6'], school:['#f3e9c0','#eadf9f'], constr:['#e5d7c2','#d9c9ae'],
  road:{9:'#c9ced3',8:'#cfd3d8',7:'#d6dadf',5:'#dde0e3',4:'#e3e5e7'}, foot:'#eae3d2', steps:'#d8cfc0',
  bld:'#d8d3cc', bldTop:'#ece8e2', water:'#a9d3e8',
};
const shade = (hex, f) => { const n = parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.min(255,Math.max(0,Math.round(r*f))); g=Math.min(255,Math.max(0,Math.round(g*f))); b=Math.min(255,Math.max(0,Math.round(b*f))); return `rgb(${r},${g},${b})`; };

// ---------- 정적 레이어 ----------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const SS = Math.min(1.5, DPR);
let staticCv = null;
function buildStatic() {
  const w = Math.ceil((WX1 - WX0) * SS), h = Math.ceil((WY1 - WY0) * SS);
  staticCv = document.createElement('canvas'); staticCv.width = w; staticCv.height = h;

function buildGraph() { const adj = {}; const add = (a, b, w) => { (adj[a] = adj[a] || []).push([b, w]); (adj[b] = adj[b] || []).push([a, w]); }; for (const L in LINES) { const arr = LINES[L]; for (let i = 0; i + 1 < arr.length; i++) add(L + ':' + arr[i], L + ':' + arr[i + 1], 2); } const byName = {}; for (const L in LINES) for (const s of LINES[L]) (byName[s] = byName[s] || new Set()).add(L); for (const s in byName) { const ls = [...byName[s]]; for (let i = 0; i < ls.length; i++) for (let j = i + 1; j < ls.length; j++) add(ls[i] + ':' + s, ls[j] + ':' + s, 5); } return {adj, byName}; }
const GRAPH = buildGraph();
function transit(from, to) { const {adj, byName} = GRAPH; if (!byName[from] || !byName[to]) return null; const dist = {}, prev = {}; const pq = [];[...byName[from]].forEach(L => { dist[L + ':' + from] = 0; pq.push([0, L + ':' + from]); }); while (pq.length) { pq.sort((a, b) => a[0] - b[0]); const [d, u] = pq.shift(); if (d > dist[u]) continue; for (const [v, w] of adj[u] || []) { const nd = d + w; if (nd < (dist[v] ?? Infinity)) { dist[v] = nd; prev[v] = u; pq.push([nd, v]); } } } let best = null; for (const L of byName[to]) { const k = L + ':' + to; if (dist[k] != null && (!best || dist[k] < dist[best])) best = k; } if (!best) return null; const path = []; let c = best; while (c) { path.push(c); c = prev[c]; } path.reverse(); const stations = path.length - 1; let transfers = 0; for (let i = 1; i < path.length; i++) if (path[i].split(':')[0] !== path[i - 1].split(':')[0]) transfers++; return {min:dist[best], path, stations:stations - transfers, transfers}; }

const ptrs = new Map(); let dragStart = null, moved = false, pinch0 = null;
