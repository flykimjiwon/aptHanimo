<meta charset="utf-8">
<title>임장월드 신당 한바퀴</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-viewport canvas world. 종이 수첩 톤의 UI: 좌상단 단지 명패, 우상단 둥근 버튼·미니맵, 하단 이동수단 독, 길잡이 대화창, 서랍(데스크톱 우측 카드 / 모바일 하단 시트) */
:root{
  --bg:#f6f1e3; --paper:#fffdf6; --paper2:#f4ecd8; --fg:#4a3b2f; --muted:#8c7a68; --line:#e2d6bd; --line2:#cdbf9f;
  --accent:#5aa469; --accent-ink:#ffffff; --accent2:#f08a66; --signal:#e8b43a; --danger:#d95f4b; --sky:#dcefc9;
  --A:#3f9a5a; --B:#3f82c9; --C:#c0862c; --X:#8f8577; --F:#8b5cf6;
  --shadow:0 6px 18px rgba(74,59,47,.14), 0 1px 0 rgba(255,255,255,.6) inset;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1d1915; --paper:#2a241e; --paper2:#332c25; --fg:#f1e8d8; --muted:#b3a38f; --line:#4a4035; --line2:#5c5044; --accent:#7cc98a; --accent-ink:#17251a; --accent2:#f29b7c; --signal:#f0c050; --danger:#ef7b70; --sky:#1f2a1c; --A:#7cc98a; --B:#85b6ef; --C:#e1b16a; --X:#a39a8c; --F:#b89cf7; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1d1915; --paper:#2a241e; --paper2:#332c25; --fg:#f1e8d8; --muted:#b3a38f; --line:#4a4035; --line2:#5c5044; --accent:#7cc98a; --accent-ink:#17251a; --accent2:#f29b7c; --signal:#f0c050; --danger:#ef7b70; --sky:#1f2a1c; --A:#7cc98a; --B:#85b6ef; --C:#e1b16a; --X:#a39a8c; --F:#b89cf7; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark }
*{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
button{font:500 14px var(--body);color:var(--fg);background:var(--paper);border:2px solid var(--line2);border-radius:14px;padding:8px 12px;cursor:pointer;min-height:40px;box-shadow:0 2px 0 var(--line2)}
button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.small{min-height:32px;padding:4px 10px;font-size:13px;border-radius:12px}
button.round{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
button[aria-pressed="true"]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
/* 상단: 단지 명패(좌) · 둥근 버튼 묶음(우) */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.plate{background:var(--paper);border:2px solid var(--line2);border-radius:18px;padding:6px 14px 6px 10px;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow);max-width:60vw}
.plate .leaf{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--accent);flex:none;position:relative;transform:rotate(-20deg)}
.plate .leaf:after{content:"";position:absolute;left:12px;top:4px;width:2px;height:16px;background:rgba(255,255,255,.55);border-radius:2px;transform:rotate(20deg)}
.plate b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate small{display:block;font-size:11px;color:var(--muted);line-height:1.1}
#topRight{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#topRight .row{display:flex;gap:6px;align-items:center}
#topRight button{box-shadow:var(--shadow)}
.chip{background:var(--paper);border:2px solid var(--line2);border-radius:999px;padding:0 12px;min-height:44px;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;max-width:48vw;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.chip b{font-family:var(--display);font-weight:400;font-size:15px}
#minimap{width:150px;height:88px;border:2px solid var(--line2);border-radius:14px;background:var(--paper);touch-action:none;box-shadow:var(--shadow)}
/* 하단: 이동수단 독 · HUD · 액션 */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 60px);background:var(--paper);border:2px solid var(--line2);border-radius:22px;padding:6px;display:flex;gap:4px;box-shadow:var(--shadow);z-index:5}
#dock button{border:0;background:transparent;box-shadow:none;min-height:50px;min-width:62px;padding:4px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;line-height:1.1}
#dock button span.ic{font-size:20px;line-height:1}
#dock button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#hud{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;gap:8px;align-items:flex-end;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#stats{background:var(--paper);border:2px solid var(--line2);border-radius:16px;padding:8px 12px;min-width:150px;max-width:min(62vw,300px);font-size:12.5px;box-shadow:var(--shadow)}
#stats b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent2)}
#stats .row{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted)}
#actions{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:5}
#actions button{box-shadow:var(--shadow)}
#actions button.round{width:48px;height:48px;min-height:48px;font-size:20px}
#actions .lab{font-size:10px;line-height:1;margin-top:2px}
#btnSkip{border-radius:999px;background:var(--accent2);color:#fff;border-color:transparent}
@media (max-width:899px){ body.drawer-open #hud, body.drawer-open #actions, body.drawer-open #dock, body.drawer-open #dialog{display:none} }
@media (min-width:900px){ body.drawer-open #actions{right:380px} } /* 서랍(360px)이 액션 버튼을 덮지 않게 */
/* 광고 슬롯(DOM) */
#adslot{position:fixed;left:0;right:0;bottom:0;height:calc(50px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper2);border-top:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--muted);z-index:5}
#adslot .adline{display:flex;align-items:center;gap:8px}
#adslot .credit{font-size:10px;line-height:1.2;max-width:96vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#adslot .lab{border:1px solid var(--line2);border-radius:4px;padding:0 5px;font-size:10px}
/* 토스트(작은 말풍선) · 길잡이 대화창 */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--fg);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);width:min(560px,calc(100vw - 20px));background:var(--paper);border:2px solid var(--line2);border-radius:20px;padding:10px 14px 10px 10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:7;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#dialog.show{opacity:1;pointer-events:auto}
#dialog .face{width:52px;height:52px;border-radius:14px;background:var(--paper2);border:2px solid var(--line2);flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
#dialog .face canvas{width:48px;height:44px}
#dialog .name{font-family:var(--display);font-weight:400;font-size:12px;color:var(--accent2);line-height:1.1}
#dialog .txt{font-size:13.5px;line-height:1.4;min-width:0}
#dialog .tip{font-size:10px;color:var(--muted);margin-left:auto;align-self:flex-end;white-space:nowrap}
/* 서랍 */
#drawer{position:fixed;z-index:6;background:var(--paper);border:2px solid var(--line2);display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
#drawer header{display:flex;gap:6px;padding:8px 10px;border-bottom:2px solid var(--line);align-items:center;flex-wrap:wrap;background:var(--paper2);border-radius:16px 16px 0 0}
#drawer header .tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
#drawer header .tabs button{min-height:30px;padding:3px 10px;font-size:12.5px;border-radius:999px;box-shadow:none;border-width:1.5px}
#drawer .body{overflow:auto;padding:10px 12px;min-width:0;-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  #drawer{right:10px;top:calc(env(safe-area-inset-top,0px) + 164px);bottom:calc(60px + env(safe-area-inset-bottom,0px));width:360px;border-radius:18px}
  #drawer.hidden{display:none}
}
@media (max-width:899px){
  #drawer{left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));max-height:56vh;border-radius:20px 20px 0 0;border-bottom:0}
  #drawer.hidden{display:none}
  #minimap{width:110px;height:64px}
  #stats{max-width:56vw;min-width:0}
  .plate{max-width:52vw} .plate b{font-size:16px}
  #dock button{min-width:54px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 62px)}
  #dialog{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 142px);padding:8px 10px 8px 8px}
  #dialog .face{width:44px;height:44px} #dialog .face canvas{width:40px;height:37px}
  #dialog .txt{font-size:12.5px} #dialog .tip{display:none}
}
@media (max-width:899px) and (max-height:520px){ #minimap{display:none} #dialog{top:calc(env(safe-area-inset-top,0px) + 62px)} #toast{top:calc(env(safe-area-inset-top,0px) + 8px)} } /* 가로 모드 폰: 미니맵 접고 대화창을 올려 HUD와 겹치지 않게 */
.badge{display:inline-block;font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:4px;line-height:16px;vertical-align:middle}
.g-A,.g-A-est,.g-official{color:var(--A)} .g-B,.g-review{color:var(--B)} .g-C,.g-estimate{color:var(--C)} .g-X,.g-unknown,.g-X→확인{color:var(--X)} .g-F,.g-concept{color:var(--F)}
.card{border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;background:var(--paper2)}
.card h4{margin:0 0 4px;font-size:13.5px}
.card p{margin:3px 0;font-size:12.5px}
.card .src{color:var(--muted);font-size:11.5px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:3px 8px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.check li .box{width:18px;height:18px;border:2px solid var(--line2);border-radius:6px;flex:none;margin-top:2px;background:var(--paper)}
.check li.done .box{background:var(--accent);border-color:var(--accent)}
.check li.done{color:var(--muted);text-decoration:line-through}
.poi-list button{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 10px;min-height:36px;box-shadow:none;border-width:1.5px;border-radius:12px}
#modal{position:fixed;inset:0;background:rgba(60,45,30,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.hidden{display:none}
#modal .box{background:var(--paper);color:var(--fg);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px 18px 16px;border:2px solid var(--line2);box-shadow:var(--shadow)}
#modal h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;text-wrap:balance}
#modal h3{font-size:15px;margin:14px 0 6px}
#modal p{margin:6px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opts button{min-height:64px;text-align:left;padding:10px 12px;line-height:1.35;border-radius:16px}
.opts button small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.opts button[aria-pressed="true"] small{color:inherit;opacity:.85}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.cmp th{color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
textarea.note{width:100%;min-height:200px;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--paper2);color:var(--fg);border:1.5px solid var(--line2);border-radius:10px;padding:8px}
.muted{color:var(--muted)} .small{font-size:12px}
.lines span{display:inline-block;color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;margin-right:3px;line-height:16px}
.interstitial{position:fixed;inset:0;background:#2b2118;color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.interstitial.hidden{display:none}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
@media (prefers-reduced-motion: reduce){ #toast,#dialog{transition:none} }
</style>

<canvas id="world" aria-label="신당·왕십리 임장 월드"></canvas>

<div id="top">
  <div class="plate" id="chipComplex"><span class="leaf"></span><div><b>단지</b><small>—</small></div></div>
  <div id="topRight">
    <div class="row">
      <span class="chip" id="chipClock" role="button" tabindex="0">🕗 <b>아침 08시</b></span>
      <button class="round" id="btnNight" aria-pressed="false" aria-label="밤 모드">🌙</button>
      <button class="round" id="btnDrawer" aria-label="서랍 열기">📋</button>
    </div>
    <canvas id="minimap" aria-label="미니맵"></canvas>
  </div>
</div>

<div id="hud">
  <div id="stats">
    <div><b id="stMin">0</b> 분 <span class="muted small" id="stMode">도보 · 실제 환산</span></div>
    <div class="row"><span id="stDist">0 m</span><span id="stUp">↑0 m</span><span id="stCross">횡단 0</span><span id="stStairs">계단 0</span></div>
    <div class="row small" id="stHint">목적지를 탭하거나 서랍에서 고르세요</div>
  </div>
</div>
<div id="actions">
  <button class="small" id="btnSkip" hidden>⏩ 건너뛰기</button>
  <button class="round" id="btnDest" aria-label="목적지 목록">📍</button>
  <button class="round" id="btnNote" aria-label="임장 노트">📝</button>
  <button class="round" id="btnCenter" aria-label="내 위치로">🎯</button>
</div>

<div id="dock" role="group" aria-label="이동 수단">
  <button data-mode="walk" aria-pressed="true"><span class="ic">🚶</span>도보</button>
  <button data-mode="stroller" aria-pressed="false"><span class="ic">🍼</span>유모차</button>
  <button data-mode="bike" aria-pressed="false"><span class="ic">🚲</span>자전거</button>
  <button data-mode="car" aria-pressed="false"><span class="ic">🚗</span>차</button>
</div>
<div id="dialog" role="status" aria-live="polite">
  <div class="face"><canvas id="dlgFace" width="96" height="88" aria-hidden="true"></canvas></div>
  <div style="min-width:0;flex:1"><div class="name" id="dlgName">길잡이 보리</div><div class="txt" id="dlgText"></div></div>
  <span class="tip">탭해서 닫기</span>
</div>

<div id="drawer" class="hidden">
  <header>
    <div class="tabs">
      <button data-tab="info" aria-pressed="true">단지</button>
      <button data-tab="check" aria-pressed="false">체크리스트</button>
      <button data-tab="cards" aria-pressed="false">이슈 카드</button>
      <button data-tab="dest" aria-pressed="false">목적지</button>
      <button data-tab="cmp" aria-pressed="false">비교</button>
    </div>
    <button class="small" id="btnDrawerClose" aria-label="서랍 닫기">✕</button>
  </header>
  <div class="body" id="drawerBody"></div>
</div>

<div id="adslot"><div class="adline"><span class="lab">광고</span><span>DOM 배너 슬롯(모의) · 캔버스 밖 · 정보는 광고 뒤에 잠기지 않음</span></div><div class="credit" id="credit">지도 데이터 © OpenStreetMap contributors (ODbL) · 고도 SRTM 30m(OpenTopoData) · 단지 사실 네이버부동산·호갱노노 수동 열람 요약(추정 포함)</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="interstitial" class="interstitial hidden"><div><span class="badge" style="color:#fff">광고</span> 셀 이동 전면 광고(모의)</div><div id="interCount">3</div><button id="interSkip" class="small">건너뛰기</button></div>

<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-label="대화 상자"><div class="box" id="modalBox"></div></div>
