name: Verify

# 실행 정책(2026-10-20): 요청할 때만 실행한다 — `gh workflow run <이 파일>` 또는 Actions 탭 "Run workflow".
# main push·PR·예약 자동 실행은 두지 않는다(비공개 저장소 Actions 무료 분 월 2,000분 보호 · 모든 저장소 공통). 다시 켜려면 사용자 확인.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Build production assets
        run: bun run build
      - name: Run smoke tests
        run: bun run smoke
      - name: Run lint
        run: bun run lint

  prototype:
    name: Prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Run prototype verification
        run: node prototype/tests/run.mjs
      - name: Run prototype harness tests
        run: node --test prototype/tests/harness.test.mjs
      - name: Rebuild deterministic prototype artifacts offline
        env:
          PYTHONHASHSEED: "0"
        run: |
          python prototype/assemble.py
          python prototype/build.py
          python prototype/stylelab/build_stylelab.py
          python prototype/stylelab3d/build_island_data.py
      - name: Verify generated artifacts are committed
        run: >-
          git diff --exit-code --
          prototype/template.html
          prototype/index.html
          prototype/dev.html
          prototype/stylelab/index.html
          prototype/stylelab/dev.html
          prototype/stylelab3d/island_data.js
